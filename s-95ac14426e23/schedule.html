<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>UFF schedule</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#22221e;--mute:#7a766c;--line:#e4dfd3;--accent:#009639;--red:#ed2e38}
@media (prefers-color-scheme:dark){:root{--bg:#171714;--card:#1f1f1b;--ink:#f1eee6;--mute:#9a968b;--line:#34332d}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:760px;margin:0 auto;padding:28px 16px 8px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.sub{color:var(--mute);font-size:14px}
main{max-width:760px;margin:0 auto;padding:8px 16px 64px}
.day{margin-top:28px}
.day h2{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.day h2 small{color:var(--mute);font-weight:400}
.today{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border:0;padding:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit}
.cell img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--line)}
.cell span{display:block;font-size:13px;color:var(--mute);margin-top:4px}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.empty{color:var(--mute);margin-top:32px}
.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;border-radius:8px;background:var(--line);color:var(--mute);font-size:12px;text-align:center;padding:8px}
.bad{color:var(--red)!important;font-weight:600}
.toggle{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;margin-top:10px}
footer{color:var(--mute);font-size:12px;text-align:center;padding:24px 16px 40px}
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:min(560px,100vw);max-height:100dvh;border-radius:14px;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.m-img{display:block;width:100%;height:auto}
.m-body{padding:14px 16px 20px}
.m-meta{color:var(--mute);font-size:13px;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tab{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cap{white-space:pre-wrap;font-size:15px;margin:0}
.nav{display:flex;justify-content:space-between;align-items:center;padding:0 16px 16px}
.nav button,.close{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border:0;width:36px;height:36px;padding:0;font-size:20px;line-height:36px}
@media (min-width:600px){.grid{gap:12px}}
</style>
</head>

<script>
const DATA=[{"slot": "2026-10-22 07:00", "text": "YOU ARE A FUTURE ANCESTOR. THEY DEPEND ON WHAT YOU DO TODAY", "ig": "We were born free. We want to die free.\n\nIf not for yourself, do it for your great-grandchildren and their children.\n\nYou are a future ancestor. They depend on what you do today.\n\n#Freedom #FreePalestine", "li": "We were born free. We want to die free.\n\nIf not for yourself, do it for your great-grandchildren and their children.\n\nYou are a future ancestor. They depend on what you do today.\n\nhttps://uff.live/\n\n#Freedom #FreePalestine", "img": "2026-10-22-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-22 11:00", "text": "LOVING YOU IS EASY. IT'S THE LIVING THAT SCARS. LOVING YOU IS EASY. IT'S THE LIVING THAT'S HARD", "ig": "To Palestine, Congo, Sudan, with love.\n\nLoving a people is easy. Staying with them through the war, the hunger and the silence of the world is the hard part.\n\n#Poetry #FreePalestine", "li": "To Palestine, Congo, Sudan, with love.\n\nLoving a people is easy. Staying with them through the war, the hunger and the silence of the world is the hard part.\n\nhttps://uff.live/\n\n#Poetry #FreePalestine", "img": "2026-10-22-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-22 15:30", "text": "THE REST OF US JUST WANT TO LIVE, AND LET OTHERS LIVE", "ig": "Most people don't want to rule anyone. They don't want to conquer anyone either.\n\nThey want to work, look after their families, and help each other get through the day.\n\nWanting power over other people is the exception, not the rule. The rest of us just want to live, and let others live.\n\n#Humanity #FreePalestine", "li": "Most people don't want to rule anyone. They don't want to conquer anyone either.\n\nThey want to work, look after their families, and help each other get through the day.\n\nWanting power over other people is the exception, not the rule. The rest of us just want to live, and let others live.\n\nhttps://uff.live/\n\n#Humanity #FreePalestine", "img": "2026-10-22-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-23 07:00", "text": "MOVE AT THE SPEED OF LIFE, NOT THE SPEED OF LIGHT", "ig": "Instant gratification. Distraction. A crisis of meaning.\n\nThese are side effects of thinking we have to move at the speed of light.\n\nWe don't. Slow down and you will see.\n\n#SlowDown #FreePalestine", "li": "Instant gratification. Distraction. A crisis of meaning.\n\nThese are side effects of thinking we have to move at the speed of light.\n\nWe don't. Slow down and you will see.\n\nhttps://uff.live/\n\n#SlowDown #FreePalestine", "img": "2026-10-23-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-23 11:00", "text": "FEELING DISCOMBOBULATED? YOU'RE NOT ALONE", "ig": "Feeling discombobulated? You're not alone.\n\nThe news, the noise, the sense that everything is too much. A lot of us feel it.\n\nBut alone won't fix it. United, we will.\n\n#Unity #FreePalestine", "li": "Feeling discombobulated? You're not alone.\n\nThe news, the noise, the sense that everything is too much. A lot of us feel it.\n\nBut alone won't fix it. United, we will.\n\nhttps://uff.live/\n\n#Unity #FreePalestine", "img": "2026-10-23-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-23 15:30", "text": "WE HAVE ALWAYS OUTNUMBERED THE ONES WHO RULE US", "ig": "Imagine waking up one day to a free Palestine.\n\nOlive trees in the morning light. Families at long tables. A child running across a field with nothing falling from the sky.\n\nIt is not a fantasy. It is what ordinary people want everywhere, and ordinary people are most of the world. We have always outnumbered the ones who rule us.\n\n#FreePalestine #Imagine", "li": "Imagine waking up one day to a free Palestine.\n\nOlive trees in the morning light. Families at long tables. A child running across a field with nothing falling from the sky.\n\nIt is not a fantasy. It is what ordinary people want everywhere, and ordinary people are most of the world. We have always outnumbered the ones who rule us.\n\nhttps://uff.live/\n\n#FreePalestine #Imagine", "img": "2026-10-23-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-24 07:00", "text": "BELOVED PALESTINE, I SHALL NOT REST UNTIL YOU ARE FREE", "ig": "Beloved Palestine,\n\nI shall not rest until you are free, for you have suffered enough.\n\nPray forgive me, for I have been distracted far too long. Do not mistake my silence for neglect. I thought it would end. I thought the world would put it right, and I was wrong to wait.\n\nI remain, until you are free, yours devotedly.\n\n#FreePalestine #BelovedPalestine", "li": "Beloved Palestine,\n\nI shall not rest until you are free, for you have suffered enough.\n\nPray forgive me, for I have been distracted far too long. Do not mistake my silence for neglect. I thought it would end. I thought the world would put it right, and I was wrong to wait.\n\nI remain, until you are free, yours devotedly.\n\nhttps://uff.live/\n\n#FreePalestine #BelovedPalestine", "img": "2026-10-24-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-24 11:00", "text": "NOT A DAY PASSES BUT I THINK OF YOU", "ig": "My dearest Palestine,\n\nNot a day passes but I think of you, for your name is in my heart and will not leave it.\n\nI have little to give, my darling, but my voice, and I promise never to lower it, for you deserve to be heard.\n\nEver yours, and faithfully.\n\n#FreePalestine #BelovedPalestine", "li": "My dearest Palestine,\n\nNot a day passes but I think of you, for your name is in my heart and will not leave it.\n\nI have little to give, my darling, but my voice, and I promise never to lower it, for you deserve to be heard.\n\nEver yours, and faithfully.\n\nhttps://uff.live/\n\n#FreePalestine #BelovedPalestine", "img": "2026-10-24-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-24 15:30", "text": "I HAVE NOT FORGOTTEN YOU, AND I NEVER WILL", "ig": "Dear Palestine,\n\nThey say time heals all wounds. Do not believe them, for you have waited long enough.\n\nI have not forgotten your olive trees, nor the long tables, nor the children who ran through your streets. One day I shall sit at those tables with you.\n\nUntil then, I shall keep writing. Always yours.\n\n#FreePalestine #BelovedPalestine", "li": "Dear Palestine,\n\nThey say time heals all wounds. Do not believe them, for you have waited long enough.\n\nI have not forgotten your olive trees, nor the long tables, nor the children who ran through your streets. One day I shall sit at those tables with you.\n\nUntil then, I shall keep writing. Always yours.\n\nhttps://uff.live/\n\n#FreePalestine #BelovedPalestine", "img": "2026-10-24-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-25 07:00", "text": "I SHALL TELL YOUR STORY TO ALL WHO WILL LISTEN", "ig": "My darling Palestine,\n\nForgive the long silences between my letters, for the world is loud and I am often weak.\n\nBut I am here. I am learning your history, and I shall tell it to everyone who will listen.\n\nFaithfully yours.\n\n#FreePalestine #BelovedPalestine", "li": "My darling Palestine,\n\nForgive the long silences between my letters, for the world is loud and I am often weak.\n\nBut I am here. I am learning your history, and I shall tell it to everyone who will listen.\n\nFaithfully yours.\n\nhttps://uff.live/\n\n#FreePalestine #BelovedPalestine", "img": "2026-10-25-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-25 11:00", "text": "I CANNOT BE PATIENT WHILE YOU ARE HURTING", "ig": "Dearest Palestine,\n\nThey tell me to be patient, but I cannot be, for patience is a luxury of those who are not in pain.\n\nI shall be restless until you are free.\n\nYours, impatiently.\n\n#FreePalestine #BelovedPalestine", "li": "Dearest Palestine,\n\nThey tell me to be patient, but I cannot be, for patience is a luxury of those who are not in pain.\n\nI shall be restless until you are free.\n\nYours, impatiently.\n\nhttps://uff.live/\n\n#FreePalestine #BelovedPalestine", "img": "2026-10-25-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-25 15:30", "text": "THERE ARE MORE OF US THAN THEY WILL TELL YOU", "ig": "Beloved,\n\nWherever you are tonight, know that someone is thinking of you, for there are more of us than they will tell you.\n\nWe are coming, slowly and together.\n\nYours, with all my heart.\n\n#FreePalestine #BelovedPalestine", "li": "Beloved,\n\nWherever you are tonight, know that someone is thinking of you, for there are more of us than they will tell you.\n\nWe are coming, slowly and together.\n\nYours, with all my heart.\n\nhttps://uff.live/\n\n#FreePalestine #BelovedPalestine", "img": "2026-10-25-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-26 07:00", "text": "PICKING OLIVES IS NOT A SECURITY THREAT", "ig": "It is October, so Palestinian families are out in the groves picking olives, as they have for generations.\n\nOn one Friday this month, Palestinian authorities counted 19 settler attacks on harvesters and trees. Rights groups say the army helps or watches.\n\nPick the olives. Stop the burning.\n\n#FreePalestine #OliveHarvest", "li": "It is October, so Palestinian families are out in the groves picking olives, as they have for generations.\n\nOn one Friday this month, Palestinian authorities counted 19 settler attacks on harvesters and trees. Rights groups say the army helps or watches.\n\nPick the olives. Stop the burning.\n\nhttps://uff.live/\n\n#FreePalestine #OliveHarvest", "img": "2026-10-26-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-26 11:00", "text": "THEY CAN UPROOT THE TREES. NOT THE PEOPLE", "ig": "Every harvest, families walk back to their groves with ladders, buckets and old sacks. Palestinian officials counted dozens of trees uprooted or burned in a single village this month, with soldiers and settlers watching or helping.\n\nThey can uproot the trees. They cannot uproot the people.\n\n#FreePalestine #OliveHarvest", "li": "Every harvest, families walk back to their groves with ladders, buckets and old sacks. Palestinian officials counted dozens of trees uprooted or burned in a single village this month, with soldiers and settlers watching or helping.\n\nThey can uproot the trees. They cannot uproot the people.\n\nhttps://uff.live/\n\n#FreePalestine #OliveHarvest", "img": "2026-10-26-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-26 15:30", "text": "IF THEY DO THIS TO DIPLOMATS, IMAGINE WHAT THEY DO TO FARMERS", "ig": "On Saturday 17 October, masked settlers attacked European diplomats near Taybeh. A French mayor says he was kicked and beaten while wearing his official sash. The EU wants accountability. At the time of writing, nobody had been arrested.\n\nPeople with passports have someone to call. Palestinian farmers get this all harvest, with no one to call.\n\n#FreePalestine #WestBank", "li": "On Saturday 17 October, masked settlers attacked European diplomats near Taybeh. A French mayor says he was kicked and beaten while wearing his official sash. The EU wants accountability. At the time of writing, nobody had been arrested.\n\nPeople with passports have someone to call. Palestinian farmers get this all harvest, with no one to call.\n\nhttps://uff.live/\n\n#FreePalestine #WestBank", "img": "2026-10-26-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-27 07:00", "text": "'CEASEFIRE' IS WHAT THEY CALL THE WAR WHEN IT IS QUIETER", "ig": "A ceasefire began in Gaza in October last year. Since then, medics say more than 1,400 Palestinians have been killed, and strikes carried on this month, including on the anniversary of 7 October.\n\nA ceasefire where only one side keeps firing is a quieter war with a better press release.\n\n#FreePalestine #Gaza", "li": "A ceasefire began in Gaza in October last year. Since then, medics say more than 1,400 Palestinians have been killed, and strikes carried on this month, including on the anniversary of 7 October.\n\nA ceasefire where only one side keeps firing is a quieter war with a better press release.\n\nhttps://uff.live/\n\n#FreePalestine #Gaza", "img": "2026-10-27-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-27 11:00", "text": "THE CEASEFIRE DID NOT BRING THEM BACK", "ig": "Behind every number in the ceasefire count is a person who had plans for this week. A birthday, a school run, a harvest.\n\nWe keep saying their names because the world keeps rounding them down.\n\n#FreePalestine #Gaza", "li": "Behind every number in the ceasefire count is a person who had plans for this week. A birthday, a school run, a harvest.\n\nWe keep saying their names because the world keeps rounding them down.\n\nhttps://uff.live/\n\n#FreePalestine #Gaza", "img": "2026-10-27-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-27 15:30", "text": "ONE IN FIVE FAMILIES IN GAZA EATS ONE MEAL A DAY", "ig": "The UN says aid agencies still reach hundreds of thousands of people in Gaza each month. It also says about one in five families eats one meal a day, and half ran out of food at least once last month.\n\nIsrael says enough aid is going in and blames distribution. Whoever is right about the trucks, the dinners are still missing.\n\n#FreePalestine #Gaza", "li": "The UN says aid agencies still reach hundreds of thousands of people in Gaza each month. It also says about one in five families eats one meal a day, and half ran out of food at least once last month.\n\nIsrael says enough aid is going in and blames distribution. Whoever is right about the trucks, the dinners are still missing.\n\nhttps://uff.live/\n\n#FreePalestine #Gaza", "img": "2026-10-27-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-28 07:00", "text": "WHO GETS THE SPOTLIGHT GETS THE SYMPATHY", "ig": "Masked settlers beat European diplomats and it made headlines across Europe. Palestinian farmers have been hit all month, and most of us have not heard their names.\n\nSympathy follows the passport. It should follow the person.\n\n#FreePalestine #Media", "li": "Masked settlers beat European diplomats and it made headlines across Europe. Palestinian farmers have been hit all month, and most of us have not heard their names.\n\nSympathy follows the passport. It should follow the person.\n\nhttps://uff.live/\n\n#FreePalestine #Media", "img": "2026-10-28-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-28 11:00", "text": "'BOTH SIDES' IS A SIDE", "ig": "Watch when 'both sides' appears. It tends to show up just after somebody says out loud what is actually happening.\n\nStaying in the middle of a fire is still a choice.\n\n#FreePalestine #Neutrality", "li": "Watch when 'both sides' appears. It tends to show up just after somebody says out loud what is actually happening.\n\nStaying in the middle of a fire is still a choice.\n\nhttps://uff.live/\n\n#FreePalestine #Neutrality", "img": "2026-10-28-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-28 15:30", "text": "WHAT THEY TEST ON PALESTINIANS, THEY SELL TO US ALL", "ig": "Surveillance, border walls, crackdowns on protest, a media that tells you who the villain is. They are tried out on one people first, then sold as normal everywhere else.\n\nThat is why this is not a faraway story. It is a preview.\n\n#FreePalestine #Solidarity", "li": "Surveillance, border walls, crackdowns on protest, a media that tells you who the villain is. They are tried out on one people first, then sold as normal everywhere else.\n\nThat is why this is not a faraway story. It is a preview.\n\nhttps://uff.live/\n\n#FreePalestine #Solidarity", "img": "2026-10-28-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-29 07:00", "text": "A TENT IS NOT A WINTER PLAN", "ig": "Winter is coming, and many families in Gaza are still living in tents that barely survived the last one. Aid groups have been asking for shelter supplies for months.\n\nA ceasefire should mean a roof. Ask who is blocking it.\n\n#FreePalestine #Gaza", "li": "Winter is coming, and many families in Gaza are still living in tents that barely survived the last one. Aid groups have been asking for shelter supplies for months.\n\nA ceasefire should mean a roof. Ask who is blocking it.\n\nhttps://uff.live/\n\n#FreePalestine #Gaza", "img": "2026-10-29-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-29 11:00", "text": "SUDAN NEEDS HELP. WHERE ARE THE HEADLINES?", "ig": "The UN says about 33.7 million people in Sudan need urgent help this year, and calls it the world's largest humanitarian crisis. Famine has been confirmed in several areas.\n\nSudan is not short of suffering. It is short of attention. Ask your government what it is doing about it.\n\n#Sudan #FreePalestine", "li": "The UN says about 33.7 million people in Sudan need urgent help this year, and calls it the world's largest humanitarian crisis. Famine has been confirmed in several areas.\n\nSudan is not short of suffering. It is short of attention. Ask your government what it is doing about it.\n\nhttps://uff.live/\n\n#Sudan #FreePalestine", "img": "2026-10-29-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-29 15:30", "text": "SUDAN, CONGO, PALESTINE. DIFFERENT MAPS, SAME SILENCE", "ig": "Three places, three wars, one pattern: the powerful decide who counts, and the rest of us are told it is complicated.\n\nIt is not complicated. People are being starved, displaced and killed, and we are asked to look away.\n\nListen anyway.\n\n#FreePalestine #Sudan", "li": "Three places, three wars, one pattern: the powerful decide who counts, and the rest of us are told it is complicated.\n\nIt is not complicated. People are being starved, displaced and killed, and we are asked to look away.\n\nListen anyway.\n\nhttps://uff.live/\n\n#FreePalestine #Sudan", "img": "2026-10-29-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-30 07:00", "text": "PESSIMISM NOTICES. APATHY LOOKS AWAY", "ig": "People call you negative when you notice. Looking away is the real problem.\n\nStay pessimistic if you must. Just stay in the room.\n\n#FreePalestine #Action", "li": "People call you negative when you notice. Looking away is the real problem.\n\nStay pessimistic if you must. Just stay in the room.\n\nhttps://uff.live/\n\n#FreePalestine #Action", "img": "2026-10-30-0700.jpg", "status": "scheduled"}, {"slot": "2026-10-30 11:00", "text": "LOVE IS A VERB", "ig": "You can love a people from your sofa, and it still counts for something. It counts for more when you write the email, sign the letter, show up to the march and give what you can.\n\nLove that stays on the sofa is only a mood.\n\n#FreePalestine #Love", "li": "You can love a people from your sofa, and it still counts for something. It counts for more when you write the email, sign the letter, show up to the march and give what you can.\n\nLove that stays on the sofa is only a mood.\n\nhttps://uff.live/\n\n#FreePalestine #Love", "img": "2026-10-30-1100.jpg", "status": "scheduled"}, {"slot": "2026-10-30 15:30", "text": "SOLIDARITY STARTS SMALL. ONE PERSON HOLDS ANOTHER UP", "ig": "Every movement began with two people deciding to hold each other up. That is all solidarity is: a small, stubborn act repeated until it is too big to ignore.\n\nWho can you hold up today?\n\n#FreePalestine #Solidarity", "li": "Every movement began with two people deciding to hold each other up. That is all solidarity is: a small, stubborn act repeated until it is too big to ignore.\n\nWho can you hold up today?\n\nhttps://uff.live/\n\n#FreePalestine #Solidarity", "img": "2026-10-30-1530.jpg", "status": "scheduled"}, {"slot": "2026-10-31 07:00", "text": "I SHALL WALK TO YOU, HOWEVER LONG THE ROAD", "ig": "My darling Palestine,\n\nI shall walk to you, however long the road, for there is no other way home.\n\nThe road is steep and I am slow, but I am walking. Pray keep the light on.\n\nFaithfully yours.\n\n#FreePalestine #BelovedPalestine", "li": "My darling Palestine,\n\nI shall walk to you, however long the road, for there is no other way home.\n\nThe road is steep and I am slow, but I am walking. Pray keep the light on.\n\nFaithfully yours.\n\nhttps://uff.live/\n\n#FreePalestine #Belove const SAST=2*3600*1000;
const when=s=>new Date(s.replace(" ","T")+":00+02:00");
const nowSast=()=>new Date(Date.now()+SAST);
const dayKey=s=>s.slice(0,10);
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayLabel=k=>{const d=new Date(k+"T12:00:00Z");return [WD[d.getUTCDay()],d.getUTCDate()+" "+MO[d.getUTCMonth()]]};
let showPast=false,view=[],cur=0,plat="ig";
const todayKey=()=>nowSast().toISOString().slice(0,10);
function visible(){const t=Date.now();return DATA.filter(p=>showPast||when(p.slot).getTime()>=t-3600*1000)}
function render(){
  view=visible();const main=document.getElementById("main");main.innerHTML="";
  const pastCount=DATA.length-DATA.filter(p=>when(p.slot).getTime()>=Date.now()-3600*1000).length;
  const pb=document.getElementById("pastBtn");pb.hidden=pastCount===0;pb.textContent=showPast?"Hide earlier posts":"Show earlier posts";
  if(!view.length){main.innerHTML='<p class="empty">Nothing scheduled right now.</p>';return}
  const days={};view.forEach((p,i)=>{(days[dayKey(p.slot)]=days[dayKey(p.slot)]||[]).push([p,i])});
  Object.keys(days).sort().forEach(k=>{
    const [wd,dm]=dayLabel(k);const sec=document.createElement("section");sec.className="day";
    sec.innerHTML=`<h2>${wd} <small>${dm}</small>${k===todayKey()?'<span class="today">Today</span>':""}</h2><div class="grid"></div>`;
    const g=sec.querySelector(".grid");
    days[k].forEach(([p,i])=>{const b=document.createElement("button");b.className="cell";b.setAttribute("aria-label",p.slot.slice(11)+": "+p.text);
      b.innerHTML=(p.img?`<img loading="lazy" src="t/${p.img}" alt="">`:`<div class="ph">No preview<br>(made in ContentDrips)</div>`)+`<span${p.status==="failed"?' class="bad"':""}>${p.slot.slice(11)}${p.status==="failed"?" (failed)":""}</span>`;b.onclick=()=>open(i);g.appendChild(b)});
    main.appendChild(sec)});
}
const dlg=document.getElementById("dlg");
function fill(){const p=view[cur];const mi=document.getElementById("mImg");mi.hidden=!p.img;if(p.img){mi.src="m/"+p.img;mi.alt=p.text}
  const [wd,dm]=dayLabel(dayKey(p.slot));document.getElementById("mMeta").textContent=wd+" "+dm+", "+p.slot.slice(11)+" SAST";
  document.getElementById("mCap").textContent=plat==="ig"?p.ig:p.li;
  document.getElementById("tIg").setAttribute("aria-pressed",plat==="ig");document.getElementById("tLi").setAttribute("aria-pressed",plat==="li");
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===view.length-1}
function open(i){cur=i;fill();if(!dlg.open)dlg.showModal()}
document.getElementById("closeBtn").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.getElementById("prev").onclick=()=>{if(cur>0){cur--;fill()}};
document.getElementById("next").onclick=()=>{if(cur<view.length-1){cur++;fill()}};
document.getElementById("tIg").onclick=()=>{plat="ig";fill()};
document.getElementById("tLi").onclick=()=>{plat="li";fill()};
document.addEventListener("keydown",e=>{if(!dlg.open)return;if(e.key==="ArrowLeft")document.getElementById("prev").click();if(e.key==="ArrowRight")document.getElementById("next").click()});
document.getElementById("pastBtn").onclick=()=>{showPast=!showPast;render()};
render();
</script>
